<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <title>宮くみ 書院の見本（技術検証）</title>
    <meta name="description" content="『月蝕綺譚 -Luna Occulta-』の非公式二次創作『宮くみ』の技術検証。Unity WebGL の重さ・公式ちびの実行時取得・わいわいSDKのセーブを確かめる一枚。">
    <script>
      // 計時の起点（ページの頭）。印は window.__kitan に積む
      window.__kitan = { t0: performance.now(), marks: {} };
      window.kitanMark = function (name) { window.__kitan.marks[name] = Math.round(performance.now()); };
    </script>
    <script src="https://waiwai.town/sdk.js" crossorigin="anonymous"></script>
    <style>
      :root {
        --yoiyami: #131320; --yoiyami-hi: #1B1B2E; --geppaku: #E8E4D8; --sub: #9D93B5;
        --kindei: #D9A94C; --kindei-hi: #F0CE7E;
      }
      html, body { margin: 0; padding: 0; height: 100%; background: var(--yoiyami); color: var(--geppaku); overflow: hidden;
        font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; -webkit-text-size-adjust: 100%; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--yoiyami); touch-action: none; outline: none; }
      #veil { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--yoiyami); transition: opacity .6s ease; z-index: 2; }
      #veil.gone { opacity: 0; pointer-events: none; }
      .card { background: var(--yoiyami-hi); border: 1px solid rgba(217,169,76,.45); border-radius: 12px; padding: 22px 24px; width: min(320px, calc(100vw - 48px)); text-align: center; }
      .card h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: .2em; color: var(--kindei-hi); font-weight: 600; }
      .card p { margin: 0 0 14px; font-size: 14px; color: var(--sub); }
      .bar { height: 6px; border-radius: 999px; background: var(--yoiyami); overflow: hidden; }
      .bar i { display: block; height: 100%; width: 0; background: var(--kindei); border-radius: 999px; transition: width .2s; }
      .num { margin-top: 10px; font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; }
      #hud { position: fixed; left: max(8px, env(safe-area-inset-left)); bottom: max(8px, env(safe-area-inset-bottom)); z-index: 3;
        max-width: min(560px, calc(100vw - 16px)); background: rgba(19,19,32,.78); border: 1px solid rgba(217,169,76,.3); border-radius: 9px;
        padding: 6px 10px; font-size: 12px; line-height: 1.55; color: var(--sub); font-family: "Hiragino Sans", "Yu Gothic", sans-serif; pointer-events: none; }
      #hud b { color: var(--geppaku); font-weight: 500; }
      #err { color: var(--kindei-hi); }
      /* 見た目の型の切り替え（温・中・夜）。押し所は 44×36px・文字 15.5px（design-tokens の button 段）・角丸 5px（ゲーム画面の段） */
      #looks { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); z-index: 3;
        display: flex; gap: 8px; padding: 4px; border-radius: 10px; background: rgba(19,19,32,.78); border: 1px solid rgba(217,169,76,.3);
        font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; }
      #looks button { min-width: 52px; height: 36px; padding: 0 12px; border-radius: 5px; font: inherit; font-size: 15.5px; letter-spacing: .1em;
        color: var(--sub); background: linear-gradient(#232033, #161320); border: 1px solid #565064; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
      #looks button[aria-pressed="true"] { color: var(--kindei-hi); border-color: var(--kindei); }
      #looks button:active { background: linear-gradient(#16131F, #1C1929); }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="veil"><div class="card">
      <h1>宮くみ</h1>
      <p>書院を組み立てています</p>
      <div class="bar"><i id="bar"></i></div>
      <div class="num" id="num">0% ・ 0.0秒</div>
    </div></div>
    <div id="looks" role="group" aria-label="見た目">
      <button type="button" data-look="warm" aria-pressed="false">温</button>
      <button type="button" data-look="mid" aria-pressed="false">中</button>
      <button type="button" data-look="night" aria-pressed="false">夜</button>
    </div>
    <div id="hud">
      <div id="hud-load"><b>読込</b>: 待っています</div>
      <div id="hud-chibi"><b>ちび</b>: まだ</div>
      <div id="hud-save"><b>記録</b>: まだ</div>
      <div id="hud-fps"><b>描画</b>: 測っています</div>
      <div id="err"></div>
    </div>
    <script src="Build/WebGL-br.loader.js"></script>
    <script>
      (function () {
        // iOS のダブルタップ拡大・ピンチを止める
        document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
        var lastTouch = 0;
        document.addEventListener('touchend', function (e) { var n = Date.now(); if (n - lastTouch < 350) e.preventDefault(); lastTouch = n; }, { passive: false });

        var K = window.__kitan;
        function sec(ms) { return (ms / 1000).toFixed(1); }
        function el(id) { return document.getElementById(id); }
        // 見た目の型: ?look=warm|mid|night（既定 night）。押したら即時に切り替え、URL も書き換える（再読み込みはしない）
        var LOOKS = ['warm', 'mid', 'night'];
        var look = (function () { try { var q = new URLSearchParams(location.search).get('look'); return LOOKS.indexOf(q) >= 0 ? q : 'night'; } catch (e) { return 'night'; } })();
        var lookPending = false;
        function paintLook(k) { Array.prototype.forEach.call(document.querySelectorAll('#looks button'), function (b) { b.setAttribute('aria-pressed', b.dataset.look === k ? 'true' : 'false'); }); }
        paintLook(look);
        Array.prototype.forEach.call(document.querySelectorAll('#looks button'), function (b) {
          b.addEventListener('click', function () {
            look = b.dataset.look; paintLook(look);
            try { var u = new URL(location.href); u.searchParams.set('look', look); history.replaceState(null, '', u.toString()); } catch (e) {}
            if (window.unityInstance) window.unityInstance.SendMessage('ShoinLook', 'SetLook', look); else lookPending = true;
          });
        });
        window.kitanStatus = function (slot, text) {
          if (slot === 'look') { if (LOOKS.indexOf(text) >= 0) { look = text; paintLook(text); } return; }
          var node = el('hud-' + slot); if (!node) return;
          var m = /^([^:：]+)[:：]\s*(.*)$/.exec(text);
          node.innerHTML = '';
          if (m) { var b = document.createElement('b'); b.textContent = m[1]; node.appendChild(b); node.appendChild(document.createTextNode(': ' + m[2])); }
          else node.textContent = text;
        };
        window.addEventListener('error', function (e) { el('err').textContent = '不具合: ' + String(e.message || e).slice(0, 120); });

        var canvas = el('unity-canvas');
        K.marks['loader-start'] = Math.round(performance.now());
        var tick = setInterval(function () { el('num').textContent = el('num').dataset.p + '% ・ ' + sec(performance.now()) + '秒'; }, 100);
        el('num').dataset.p = '0';
        createUnityInstance(canvas, {
          dataUrl: "Build/WebGL-br.data.unityweb",
          frameworkUrl: "Build/WebGL-br.framework.js.unityweb",
          codeUrl: "Build/WebGL-br.wasm.unityweb",
          // Unity 6000.0.36 の不具合よけ: fallback 有効時はスレッド無しでも workerUrl を取りにいく
          workerUrl: "TemplateData/noop-worker.js",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "kitan-circle",
          productName: "宮くみ 書院の見本",
          productVersion: "1.0",
          // 描く細かさ: 既定は端末の倍率（上限 2）。検分用に ?dpr=1.5 のように下げられる
          devicePixelRatio: (function () { var d = window.devicePixelRatio || 1, q = parseFloat(new URLSearchParams(location.search).get('dpr')); return q > 0 ? Math.min(q, d) : Math.min(d, 2); })(),
        }, function (p) {
          var pct = Math.round(p * 100);
          el('num').dataset.p = String(pct);
          el('bar').style.width = pct + '%';
          if (p >= 0.9 && !K.marks['downloaded']) K.marks['downloaded'] = Math.round(performance.now());
        }).then(function (inst) {
          window.unityInstance = inst;
          K.marks['instance-ready'] = Math.round(performance.now());
          clearInterval(tick);
          el('veil').classList.add('gone');
          if (lookPending) inst.SendMessage('ShoinLook', 'SetLook', look);
          window.kitanStatus('load', '読込: 書院が出るまで ' + sec(K.marks['instance-ready']) + '秒');
        }).catch(function (msg) {
          clearInterval(tick);
          el('num').textContent = '開けませんでした';
          el('err').textContent = '不具合: ' + String(msg).slice(0, 160);
        });
      })();
    </script>
  </body>
</html>
